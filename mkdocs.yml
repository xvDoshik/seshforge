site_name: seshforge
site_description: Lock-free Telethon - forge StringSession from tdata / .session
site_url: https://xvdoshik.github.io/seshforge/
repo_url: https://github.com/xvDoshik/seshforge
repo_name: xvDoshik/seshforge
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 xvDosha

theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Light mode
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Dark mode
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/xvDoshik
    - icon: fontawesome/solid/globe
      link: https://dosha.pw

nav:
  - Home: index.md
  - Quick start: quickstart.md
  - CLI: cli.md
  - API: api.md
  - Architecture: architecture.md
  - Troubleshooting: troubleshooting.md
  - RU:
    - Главная: ru/index.md
    - Быстрый старт: ru/quickstart.md
    - CLI: ru/cli.md
    - API: ru/api.md
